<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In - Telegram Cloud Drive</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
            position: relative;
            background-color: var(--bg-main);
        }

        /* Floating Top-Right Theme Toggle */
        .auth-theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.15s ease;
            z-index: 10;
        }

        .auth-theme-toggle:hover {
            background: var(--surface-elevated);
            border-color: var(--border-color-hover);
            transform: translateY(-1px);
        }

        /* Authentication Container Card */
        .auth-card-modern {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: var(--card-shadow-hover);
            transition: all 0.2s ease;
        }

        /* Header Logo */
        .auth-logo-badge {
            width: 52px;
            height: 52px;
            background: var(--primary-blue);
            color: #FFFFFF;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 4px 14px rgba(22, 131, 255, 0.3);
        }

        /* Segmented Nav Tabs */
        .auth-segmented-nav {
            display: flex;
            background: var(--surface-elevated);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-segmented-nav .nav-link {
            flex: 1;
            text-align: center;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.88rem;
            padding: 8px 16px;
            border-radius: 9px;
            border: none;
            background: transparent;
            transition: all 0.15s ease;
        }

        .auth-segmented-nav .nav-link:hover {
            color: var(--text-primary);
        }

        .auth-segmented-nav .nav-link.active {
            background: var(--primary-blue);
            color: #FFFFFF !important;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(22, 131, 255, 0.25);
        }

        /* Unified Form Field Inputs */
        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--surface-elevated);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2px 12px;
            transition: all 0.15s ease;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(22, 131, 255, 0.15);
        }

        .input-box-icon {
            color: var(--text-muted);
            margin-right: 10px;
            flex-shrink: 0;
        }

        .input-box-field {
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.9rem;
            padding: 10px 0;
            width: 100%;
            outline: none;
        }

        .input-box-field::placeholder {
            color: var(--text-muted);
        }

        /* Admin Info Callout Box */
        .admin-callout-box {
            background: var(--primary-blue-light);
            border: 1px solid var(--primary-blue-border);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.84rem;
            margin-bottom: 20px;
            line-height: 1.45;
        }

        .btn-auth-submit {
            background: var(--primary-blue);
            color: #FFFFFF !important;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 12px;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 12px rgba(22, 131, 255, 0.25);
            transition: all 0.15s ease;
            width: 100%;
            cursor: pointer;
        }

        .btn-auth-submit:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(22, 131, 255, 0.35);
        }

        .btn-send-code {
            background: var(--primary-blue-light);
            color: var(--primary-blue);
            border: 1px solid var(--primary-blue-border);
            font-weight: 600;
            font-size: 0.82rem;
            border-radius: 8px;
            padding: 6px 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-send-code:hover {
            background: var(--primary-blue);
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button class="auth-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
        <i data-lucide="moon" id="themeIcon" style="width: 20px; height: 20px;"></i>
    </button>

    <div class="auth-card-modern">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="auth-logo-badge">
                <i data-lucide="cloud" style="width: 28px; height: 28px;"></i>
            </div>
            <h3 class="fw-bold mb-1" style="font-size: 1.35rem; color: var(--text-primary);">Telegram <span class="text-primary">Cloud</span></h3>
            <p class="text-muted small mb-0" style="font-size: 0.85rem;">Encrypted SaaS Drive Dashboard</p>
        </div>

        {% include 'flash.html' %}
        <div id="authAlert" class="alert d-none mb-3" role="alert"></div>

        <!-- Segmented Tab Nav -->
        <ul class="nav auth-segmented-nav" id="authTabs" role="tablist">
            <li class="nav-item flex-fill" role="presentation">
                <button class="nav-link w-100 active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Sign In</button>
            </li>
            <li class="nav-item flex-fill" role="presentation">
                <button class="nav-link w-100" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup-pane" type="button" role="tab">Create Account</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            <!-- 1. Sign In Form -->
            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                <form method="post" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="login_username" class="form-label small fw-semibold text-muted mb-1">Username</label>
                        <div class="input-box-wrapper">
                            <i data-lucide="user" class="input-box-icon" style="width: 18px; height: 18px;"></i>
                            <input type="text" class="input-box-field" id="login_username" name="username" placeholder="Enter your username" required autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="login_password" class="form-label small fw-semibold text-muted mb-1">Password</label>
                        <div class="input-box-wrapper">
                            <i data-lucide="lock" class="input-box-icon" style="width: 18px; height: 18px;"></i>
                            <input type="password" class="input-box-field" id="login_password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn-auth-submit">
                        <i data-lucide="log-in" style="width: 18px; height: 18px; vertical-align: sub;" class="me-1"></i> Sign In to Drive
                    </button>
                </form>
            </div>

            <!-- 2. Create Account Form -->
            <div class="tab-pane fade" id="signup-pane" role="tabpanel">
                <div class="admin-callout-box">
                    <div class="d-flex align-items-center gap-2 mb-1 fw-bold text-primary">
                        <i data-lucide="shield-alert" style="width: 16px; height: 16px;"></i>
                        <span>Admin Verification Required</span>
                    </div>
                    Enter desired username, click <strong>Send Code</strong>, and enter the 6-digit verification code received from Admin to complete registration.
                </div>

                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div class="mb-3">
                        <label for="signup_username" class="form-label small fw-semibold text-muted mb-1">Desired Username</label>
                        <div class="input-box-wrapper pe-2">
                            <i data-lucide="user" class="input-box-icon" style="width: 18px; height: 18px;"></i>
                            <input type="text" class="input-box-field" id="signup_username" name="username" placeholder="Choose a username" required autocomplete="username">
                            <button type="button" class="btn-send-code ms-1" id="btnSendCode" onclick="requestCode()">
                                <i data-lucide="send" style="width: 14px; height: 14px;" class="me-1"></i> Send Code
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="signup_code" class="form-label small fw-semibold text-muted mb-1">6-Digit Verification Code</label>
                        <div class="input-box-wrapper">
                            <i data-lucide="key-round" class="input-box-icon" style="width: 18px; height: 18px;"></i>
                            <input type="text" class="input-box-field" id="signup_code" name="code" placeholder="Enter code received from Admin" maxlength="6" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="signup_password" class="form-label small fw-semibold text-muted mb-1">Password</label>
                        <div class="input-box-wrapper">
                            <i data-lucide="lock" class="input-box-icon" style="width: 18px; height: 18px;"></i>
                            <input type="password" class="input-box-field" id="signup_password" name="password" placeholder="Create a strong password" minlength="6" required autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" class="btn-auth-submit" id="btnCreateAccount">
                        <i data-lucide="user-plus" style="width: 18px; height: 18px; vertical-align: sub;" class="me-1"></i> Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function showAlert(message, type = 'info') {
            const el = document.getElementById('authAlert');
            el.className = `alert alert-${type} mb-3 small py-2 px-3 rounded-3`;
            el.innerHTML = message;
            el.classList.remove('d-none');
        }

        function requestCode() {
            const username = document.getElementById('signup_username').value.trim();
            if (!username) {
                showAlert('Please enter a username first!', 'warning');
                return;
            }

            const btn = document.getElementById('btnSendCode');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Sending...';

            fetch('/api/request-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send" style="width: 14px; height: 14px;" class="me-1"></i> Send Code';
                if (data.status === 'success') {
                    showAlert('🔑 ' + data.message, 'success');
                } else {
                    showAlert('❌ ' + data.message, 'danger');
                }
                lucide.createIcons();
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send" style="width: 14px; height: 14px;" class="me-1"></i> Send Code';
                showAlert('Network error requesting verification code.', 'danger');
                lucide.createIcons();
            });
        }

        function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signup_username').value.trim();
            const code = document.getElementById('signup_code').value.trim();
            const password = document.getElementById('signup_password').value;

            const btn = document.getElementById('btnCreateAccount');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Creating Account...';

            fetch('/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ username: username, code: code, password: password })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="user-plus" style="width: 18px; height: 18px; vertical-align: sub;" class="me-1"></i> Create Account';
                if (data.status === 'success') {
                    showAlert('🎉 ' + data.message, 'success');
                    setTimeout(() => {
                        document.getElementById('login-tab').click();
                        document.getElementById('login_username').value = username;
                    }, 1500);
                } else {
                    showAlert('❌ ' + data.message, 'danger');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="user-plus" style="width: 18px; height: 18px; vertical-align: sub;" class="me-1"></i> Create Account';
                showAlert('Network error creating account.', 'danger');
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('telegram_cloud_theme', newTheme);

            const icon = document.getElementById('themeIcon');
            if (newTheme === 'light') {
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('telegram_cloud_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
