<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - Telegram Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.15);
            --primary-accent: #3b82f6;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e0e7ff 50%, #f1f5f9 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: rgba(0, 0, 0, 0.15);
            --primary-accent: #2563eb;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background 0.3s ease;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--input-border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 32px;
        }

        .nav-pills .nav-link {
            color: var(--text-muted);
            border-radius: 12px;
            font-weight: 600;
            padding: 10px 16px;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link.active {
            background-color: var(--primary-accent);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 10px;
            padding: 12px 16px;
        }

        .form-control:focus {
            background: var(--input-bg);
            border-color: var(--primary-accent);
            color: var(--text-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .badge-admin-info {
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.3);
            color: #a78bfa;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
        <i data-lucide="moon" id="themeIcon"></i>
    </button>

    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px;">
                <i data-lucide="cloud" style="width: 30px; height: 30px;"></i>
            </div>
            <h3 class="fw-bold mb-1">Telegram Cloud</h3>
            <p class="text-muted small">Encrypted Unlimited Storage Drive</p>
        </div>

        {% include 'flash.html' %}
        <div id="authAlert" class="alert d-none" role="alert"></div>

        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Sign In</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup-pane" type="button" role="tab">Create Account</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            <!-- Login Form -->
            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                <form method="post" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="login_username" class="form-label small text-muted fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i data-lucide="user" style="width: 18px;"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="login_username" name="username" placeholder="Enter your username" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="login_password" class="form-label small text-muted fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i data-lucide="lock" style="width: 18px;"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="login_password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                        <i data-lucide="log-in" style="width: 18px; vertical-align: middle;" class="me-1"></i> Sign In to Drive
                    </button>
                </form>
            </div>

            <!-- Sign Up Form (Admin Verification Code Flow) -->
            <div class="tab-pane fade" id="signup-pane" role="tabpanel">
                <div class="badge-admin-info mb-3">
                    <i data-lucide="shield-alert" style="width: 16px; vertical-align: text-bottom;" class="me-1"></i>
                    <strong>Admin Verification Required</strong><br>
                    Request a verification code. The code will be sent to the Admin on Telegram. Get the 6-digit code from Admin to complete signup.
                </div>

                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div class="mb-3">
                        <label for="signup_username" class="form-label small text-muted fw-semibold">Desired Username</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="signup_username" name="username" placeholder="Choose a username" required>
                            <button type="button" class="btn btn-outline-primary" id="btnSendCode" onclick="requestCode()">
                                <i data-lucide="send" style="width: 15px;"></i> Send Code
                            </button>
                        </div>
                        <small class="text-muted d-block mt-1" style="font-size: 0.75rem;">Click "Send Code" to dispatch access code to Admin Telegram.</small>
                    </div>

                    <div class="mb-3">
                        <label for="signup_code" class="form-label small text-muted fw-semibold">6-Digit Admin Verification Code</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i data-lucide="key-round" style="width: 18px;"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="signup_code" name="code" placeholder="Enter code received from Admin" maxlength="6" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="signup_password" class="form-label small text-muted fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i data-lucide="lock" style="width: 18px;"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="signup_password" name="password" placeholder="Create a strong password" minlength="6" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm" id="btnCreateAccount">
                        <i data-lucide="user-plus" style="width: 18px; vertical-align: middle;" class="me-1"></i> Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showAlert(message, type = 'info') {
            const el = document.getElementById('authAlert');
            el.className = `alert alert-${type} mt-3 mb-0`;
            el.innerHTML = message;
            el.classList.remove('d-none');
        }

        function requestCode() {
            const username = document.getElementById('signup_username').value.trim();
            if (!username) {
                showAlert('Please enter a username first!', 'warning');
                return;
            }

            const btn = document.getElementById('btnSendCode');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Sending...';

            fetch('/api/request-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send" style="width: 15px;"></i> Send Code';
                if (data.status === 'success') {
                    showAlert('🔑 ' + data.message, 'success');
                } else {
                    showAlert('❌ ' + data.message, 'danger');
                }
                lucide.createIcons();
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send" style="width: 15px;"></i> Send Code';
                showAlert('Network error requesting verification code.', 'danger');
                lucide.createIcons();
            });
        }

        function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signup_username').value.trim();
            const code = document.getElementById('signup_code').value.trim();
            const password = document.getElementById('signup_password').value;

            const btn = document.getElementById('btnCreateAccount');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating Account...';

            fetch('/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ username: username, code: code, password: password })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="user-plus" style="width: 18px; vertical-align: middle;" class="me-1"></i> Create Account';
                if (data.status === 'success') {
                    showAlert('🎉 ' + data.message, 'success');
                    setTimeout(() => {
                        document.getElementById('login-tab').click();
                        document.getElementById('login_username').value = username;
                    }, 1500);
                } else {
                    showAlert('❌ ' + data.message, 'danger');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="user-plus" style="width: 18px; vertical-align: middle;" class="me-1"></i> Create Account';
                showAlert('Network error creating account.', 'danger');
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('telegram_cloud_theme', newTheme);

            const icon = document.getElementById('themeIcon');
            if (newTheme === 'light') {
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('telegram_cloud_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        });
    </script>
</body>
</html>
